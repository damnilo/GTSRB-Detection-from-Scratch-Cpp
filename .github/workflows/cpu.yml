name: cpu

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install compilers and OpenBLAS
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libopenblas-dev

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest opencv-python-headless pybind11
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja \
            -DPython3_EXECUTABLE="$(which python)" \
            -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
          cmake --build build

      - name: Test
        run: python -m pytest tests/test_reference.py
        env:
          PYTHONPATH: build
          OMP_NUM_THREADS: "4"
